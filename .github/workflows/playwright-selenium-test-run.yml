name: Daily Playwright Java Tests

on:
  schedule: # Trigger daily at 7 AM CST (13:00 UTC)
    - cron: '0 13 * * *'
  push:
    branches:
      - SeleniumGrid
  pull_request:
    branches:
      - SeleniumGrid

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-


      # Install Playwright dependencies (optional if using Selenium Grid exclusively)
      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      # Run Maven tests
      - name: Run Playwright tests
        run: mvn clean test

      # Upload test results (optional, for debugging)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/